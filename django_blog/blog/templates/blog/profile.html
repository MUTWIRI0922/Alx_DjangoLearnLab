{% extends "blog/base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2>Profile</h2>

<p>Username: {{ user.username }}</p>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update Profile</button>
</form>

<p><a href="{% url 'logout' %}">Logout</a></p>

{% endblock %}
